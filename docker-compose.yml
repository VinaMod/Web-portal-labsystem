version: "3.8"

services:
  backend:
    image:  webportal-backend:latest
    ports:
      - "5000:5000"

    environment:
      DEBUG: "True"
      HOST: "0.0.0.0"
      PORT: "5000"

      DATABASE_HOST: "192.168.187.89"
      DATABASE_USER: "labtainer"

      GOOGLE_CLIENT_ID: "876535569536-7plq7vp5tl0f5fc8bon53mpqcl1l9tjh.apps.googleusercontent.com"

    secrets:
      - secret_key
      - jwt_secret
      - google_client_secret
      - db_password

    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

secrets:
  secret_key:
    external: true
  jwt_secret:
    external: true
  google_client_secret:
    external: true
  db_password:
    external: true