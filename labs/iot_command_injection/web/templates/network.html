<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NET Surveillance | Network Config</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="main-wrapper">
        <header class="top-bar">
            <div class="logo"><i class="fas fa-video"></i> NET Surveillance HD</div>
            <nav class="nav-tabs">
                <a href="/dashboard" class="nav-tab">PREVIEW</a>
                <a href="/playback" class="nav-tab">PLAYBACK</a>
                <a href="/log" class="nav-tab">LOGS</a>
                <a href="/settings" class="nav-tab active">SETTINGS</a>
            </nav>
            <div class="user-info">
                <span>{{ user }}</span>
                <a href="/logout" class="logout-link">Logout</a>
            </div>
        </header>

        <div class="content-container">
            <aside class="sidebar">
                <div class="sidebar-header">CONFIG MENU</div>
                <a href="/info" class="menu-item"><i class="fas fa-info-circle"></i> System Info</a>
                <a href="/network" class="menu-item active"><i class="fas fa-network-wired"></i> Network Config</a>
                <a href="/account" class="menu-item"><i class="fas fa-user-lock"></i> Account</a>
                <a href="/diagnostic" class="menu-item"><i class="fas fa-tools"></i> Diagnostic</a>
                <a href="/storage" class="menu-item"><i class="fas fa-hdd"></i> Storage</a>
                <a href="/update" class="menu-item"><i class="fas fa-sync"></i> Firmware Update</a>
            </aside>

            <main class="main-view">
                <div class="view-card">
                    <div class="view-header">
                        <h2>Network Configuration</h2>
                    </div>
                    
                    <form onsubmit="event.preventDefault(); alert('Network settings applied (Simulation)');">
                        <table class="data-table">
                            <tr>
                                <th style="width: 200px;">Parameter</th>
                                <th>Value</th>
                            </tr>
                            <tr>
                                <td>DHCP</td>
                                <td><input type="checkbox" checked> Enable DHCP</td>
                            </tr>
                            <tr>
                                <td>IP Address</td>
                                <td><input type="text" value="192.168.1.100" class="login-row" style="width: 200px; padding: 5px; background: #111; color: white; border: 1px solid #444;"></td>
                            </tr>
                            <tr>
                                <td>Subnet Mask</td>
                                <td><input type="text" value="255.255.255.0" class="login-row" style="width: 200px; padding: 5px; background: #111; color: white; border: 1px solid #444;"></td>
                            </tr>
                            <tr>
                                <td>Gateway</td>
                                <td><input type="text" value="192.168.1.1" class="login-row" style="width: 200px; padding: 5px; background: #111; color: white; border: 1px solid #444;"></td>
                            </tr>
                            <tr>
                                <td>Primary DNS</td>
                                <td><input type="text" value="8.8.8.8" class="login-row" style="width: 200px; padding: 5px; background: #111; color: white; border: 1px solid #444;"></td>
                            </tr>
                            <tr>
                                <td>HTTP Port</td>
                                <td><input type="number" value="80" style="width: 80px; padding: 5px; background: #111; color: white; border: 1px solid #444;"></td>
                            </tr>
                        </table>
                        <div style="margin-top: 20px; text-align: right;">
                            <button type="submit" class="btn btn-primary" style="width: 120px;">SAVE</button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
