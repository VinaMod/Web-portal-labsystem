<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NET Surveillance | Remote Playback</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="main-wrapper">
        <header class="top-bar">
            <div class="logo"><i class="fas fa-video"></i> NET Surveillance HD</div>
            <nav class="nav-tabs">
                <a href="/dashboard" class="nav-tab">PREVIEW</a>
                <a href="/playback" class="nav-tab active">PLAYBACK</a>
                <a href="/log" class="nav-tab">LOGS</a>
                <a href="/settings" class="nav-tab">SETTINGS</a>
            </nav>
            <div class="user-info">
                <span>{{ user }}</span>
                <a href="/logout" class="logout-link">Logout</a>
            </div>
        </header>

        <div class="content-container">
            <aside class="sidebar">
                <div class="sidebar-header">PLAYBACK CALENDAR</div>
                <div style="padding: 15px; background: #222; margin: 10px; border-radius: 4px; text-align: center;">
                    <strong style="color: var(--accent-color);">APRIL 2026</strong>
                    <div style="display: grid; grid-template-columns: repeat(7, 1fr); font-size: 10px; margin-top: 10px; gap: 5px;">
                        <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
                        <span style="color: #444;">1</span><span style="color: #444;">2</span><span style="color: #444;">3</span><span>4</span><span class="active" style="background: var(--accent-color); border-radius: 50%;">5</span><span>6</span><span>7</span>
                    </div>
                </div>
                
                <div class="sidebar-header">FILE LIST</div>
                <div style="padding: 0 10px;">
                    <div style="padding: 8px; border-bottom: 1px solid #444; font-size: 11px;">
                        <i class="far fa-file-video"></i> 08:30:00 - 09:00:00
                    </div>
                    <div style="padding: 8px; border-bottom: 1px solid #444; font-size: 11px;">
                        <i class="far fa-file-video"></i> 09:00:00 - 09:30:00
                    </div>
                </div>
            </aside>

            <main class="main-view">
                <div class="view-card">
                    <div class="player-container" style="background: #111;">
                        <div style="display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-secondary);">
                            <div style="text-align: center;">
                                <i class="fas fa-search" style="font-size: 40px; margin-bottom: 15px;"></i>
                                <p>Select a file from the left to start playback</p>
                            </div>
                        </div>
                        
                        <div class="player-controls" style="opacity: 1; background: #000;">
                            <div class="control-group">
                                <button class="player-btn"><i class="fas fa-backward"></i></button>
                                <button class="player-btn"><i class="fas fa-play"></i></button>
                                <button class="player-btn"><i class="fas fa-forward"></i></button>
                            </div>
                            <div style="flex: 1; margin: 0 20px; position: relative;">
                                <div style="height: 4px; background: #333; width: 100%; position: absolute; top: 18px;"></div>
                                <div style="height: 4px; background: var(--accent-color); width: 30%; position: absolute; top: 18px;"></div>
                            </div>
                            <div class="control-group">
                                <span style="font-family: monospace; font-size: 12px; line-height: 40px;">00:00 / 30:00</span>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
