<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NET Surveillance | Live Preview</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="main-wrapper">
        <header class="top-bar">
            <div class="logo">
                <i class="fas fa-video"></i> NET Surveillance HD
            </div>
            <nav class="nav-tabs">
                <a href="/dashboard" class="nav-tab active">PREVIEW</a>
                <a href="/playback" class="nav-tab">PLAYBACK</a>
                <a href="/log" class="nav-tab">LOGS</a>
                <a href="/settings" class="nav-tab">SETTINGS</a>
            </nav>
            <div class="user-info">
                <span><i class="fas fa-user-circle"></i> {{ user }}</span>
                <a href="/logout" class="logout-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </header>

        <div class="content-container">
            <aside class="sidebar">
                <div class="sidebar-header">Device List</div>
                <a href="/dashboard" class="menu-item active"><i class="fas fa-camera"></i> Channel 01</a>
                <a href="#" class="menu-item"><i class="fas fa-camera"></i> Channel 02</a>
                <a href="#" class="menu-item"><i class="fas fa-camera-slash"></i> Channel 03 (Offline)</a>
                
                <div class="sidebar-header" style="margin-top: 20px;">PTZ Control</div>
                <div style="padding: 20px; text-align: center;">
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 150px; margin: 0 auto;">
                        <button class="btn ptz-btn" data-action="UP-LEFT" style="padding: 10px;"><i class="fas fa-chevron-up" style="transform: rotate(-45deg);"></i></button>
                        <button class="btn ptz-btn" data-action="UP" style="padding: 10px;"><i class="fas fa-chevron-up"></i></button>
                        <button class="btn ptz-btn" data-action="UP-RIGHT" style="padding: 10px;"><i class="fas fa-chevron-up" style="transform: rotate(45deg);"></i></button>
                        <button class="btn ptz-btn" data-action="LEFT" style="padding: 10px;"><i class="fas fa-chevron-left"></i></button>
                        <button class="btn btn-primary ptz-btn" data-action="HOME" style="padding: 10px;"><i class="fas fa-circle"></i></button>
                        <button class="btn ptz-btn" data-action="RIGHT" style="padding: 10px;"><i class="fas fa-chevron-right"></i></button>
                        <button class="btn ptz-btn" data-action="DOWN-LEFT" style="padding: 10px;"><i class="fas fa-chevron-down" style="transform: rotate(45deg);"></i></button>
                        <button class="btn ptz-btn" data-action="DOWN" style="padding: 10px;"><i class="fas fa-chevron-down"></i></button>
                        <button class="btn ptz-btn" data-action="DOWN-RIGHT" style="padding: 10px;"><i class="fas fa-chevron-down" style="transform: rotate(-45deg);"></i></button>
                    </div>
                    <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: center;">
                        <button class="btn ptz-btn" data-action="ZOOM-IN"><i class="fas fa-plus"></i></button>
                        <span style="line-height: 30px; color: var(--text-secondary); font-size: 11px;">ZOOM</span>
                        <button class="btn ptz-btn" data-action="ZOOM-OUT"><i class="fas fa-minus"></i></button>
                    </div>
                </div>
            </aside>

            <main class="main-view">
                <div class="player-container">
                    <!-- Simulated Live Feed -->
                    <div style="width:100%; height:100%; background: #111; display:flex; align-items:center; justify-content:center;">
                        <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1200&q=80" style="width:100%; height:100%; object-fit:cover; opacity: 0.6; filter: grayscale(1) contrast(1.2);">
                    </div>

                    <!-- OSD Overlay -->
                    <div class="osd-overlay">
                        <div class="osd-top">
                            <div class="cam-name">CAM01 - OFFICE_MAIN</div>
                            <div class="timestamp" id="osd-time">2026-04-05 09:42:15</div>
                        </div>
                        <div id="ptz-status" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--accent-color); font-weight: bold; font-size: 24px; text-shadow: 2px 2px 4px black; display: none;">
                            MOVING...
                        </div>
                        <div class="osd-bottom" style="display:flex; justify-content: space-between; font-family: monospace; text-shadow: 1px 1px 1px black;">
                            <div class="rec-indicator">● REC</div>
                            <div class="bitrate">4096 kbps</div>
                        </div>
                    </div>

                    <!-- Player Controls -->
                    <div class="player-controls">
                        <div class="control-group">
                            <button class="player-btn"><i class="fas fa-play"></i></button>
                            <button class="player-btn"><i class="fas fa-stop"></i></button>
                            <button class="player-btn"><i class="fas fa-camera"></i></button>
                            <button class="player-btn"><i class="fas fa-microphone"></i></button>
                        </div>
                        <div class="control-group">
                            <button class="player-btn"><i class="fas fa-expand"></i></button>
                            <button class="player-btn"><i class="fas fa-cog"></i></button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const timeStr = now.toTimeString().split(' ')[0];
            document.getElementById('osd-time').innerText = dateStr + ' ' + timeStr;
        }
        setInterval(updateClock, 1000);
        updateClock();

        const ptzStatus = document.getElementById('ptz-status');
        document.querySelectorAll('.ptz-btn').forEach(btn => {
            btn.addEventListener('mousedown', () => {
                const action = btn.getAttribute('data-action');
                ptzStatus.innerText = action + '...';
                ptzStatus.style.display = 'block';
            });
            btn.addEventListener('mouseup', () => {
                ptzStatus.style.display = 'none';
            });
            btn.addEventListener('mouseleave', () => {
                ptzStatus.style.display = 'none';
            });
        });
    </script>
</body>
</html>
