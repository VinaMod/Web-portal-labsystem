[global]
   workgroup = SECURECORP
   server string = SecureCorp Internal File Server
   dns proxy = no
   log file = /var/log/samba/log.%m
   max log size = 1000
   syslog = 0
   panic action = /usr/share/samba/panic-action %d
   server role = standalone server
   passdb backend = tdbsam
   obey pam restrictions = yes
   unix password sync = yes
   passwd program = /usr/bin/passwd %u
   passwd chat = *Enter\snew\s*\spassword:* %n\n *Retype\snew\s*\spassword:* %n\n *password\supdated\ssuccessfully* .
   pam password change = yes
   map to guest = bad user
   usershare allow guests = yes

# Documents share - cho phép anonymous access (public documentation)
[documents]
   comment = Company Documents - Public Access
   path = /home/sysadmin/documents
   browseable = yes
   writable = no
   guest ok = yes
   guest only = yes
   read only = yes
   create mask = 0644
   directory mask = 0755

# Config share - yêu cầu authentication (internal configuration)
[config]
   comment = System Configuration - Internal Use Only
   path = /home/sysadmin/config
   browseable = yes
   writable = no
   valid users = sysadmin
   read only = yes
   create mask = 0644
   directory mask = 0755

# Backup share - yêu cầu authentication (backup files) - không dùng trong flow chính
[backup]
   comment = Backup Files - Authorized Personnel Only
   path = /home/sysadmin/backup
   browseable = yes
   writable = yes
   valid users = sysadmin
   read only = no
   create mask = 0666
   directory mask = 0777

