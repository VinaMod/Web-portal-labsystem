# vsftpd configuration for anonymous FTP with upload capability

# Enable standalone mode
listen=YES
listen_ipv6=NO

# Anonymous FTP settings
anonymous_enable=YES
anon_upload_enable=YES
anon_mkdir_write_enable=YES
anon_other_write_enable=YES
no_anon_password=YES

# Anonymous root directory
anon_root=/home/dev01

# Disable local users
local_enable=NO

# Security settings
write_enable=YES

# Passive mode settings
pasv_enable=YES
pasv_min_port=21000
pasv_max_port=21010
pasv_address=127.0.0.1

# Logging
xferlog_enable=YES
xferlog_file=/var/log/vsftpd.log

# Other settings
ftpd_banner=Welcome to FTP Server
dirmessage_enable=YES
use_localtime=YES

# Allow anonymous to overwrite files
anon_umask=022
file_open_mode=0777

# Security - but allow uploads
seccomp_sandbox=NO
