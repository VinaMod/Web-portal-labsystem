############################################
# Upstreams
############################################
map "" $backend_a_ip {
    default 192.168.187.99;
}

map "" $backend_b_ip {
    default 192.168.187.98;
}

map "" $backend_c_ip {
    default 127.0.0.1;
}

upstream backend_c {
    server 127.0.0.1:5000;
}

upstream backend_a {
    server 192.168.187.99:5000;
}

upstream backend_b {
    server 192.168.187.98:5000;
}

############################################
# WebSocket upgrade helper
############################################

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

############################################
# Timeouts
# Docker/lab setup can take several minutes.
############################################

# Code uses subprocess timeouts around 500s, so keep gateway timeouts > 500s.
# Nginx supports suffixes: s, m.
proxy_connect_timeout 30s;
proxy_send_timeout 600s;
proxy_read_timeout 600s;


############################################
# Extract integer ID from URI
# - /lab/<id>/terminal
# - /api/lab/<id>/...
# - /api/start_lab/<id>
############################################

map $uri $lab_id {
    ~*/lab/([0-9]+) $1;
    ~*/start_lab/([0-9]+) $1;
    default "";
}


############################################
# Flow type from header or query:
# - HTTP calls: set header X-FLOW-TYPE
# - Browser navigation + WebSocket: add ?flow_type=...
############################################

map "$http_x_flow_type|$arg_flow_type" $effective_flow_type {
    ~^LABTAINER\|     LABTAINER;
    ~^CUSTOM\|        CUSTOM;
    ~^\|LABTAINER$    LABTAINER;
    ~^\|CUSTOM$       CUSTOM;
    default           "";
}

############################################
# Backend host (without app port)
############################################

map $flow_backend $flow_host {
    backend_a 192.168.187.99;
    backend_b 192.168.187.98;
    backend_c 127.0.0.1;
    default   127.0.0.1;
}

############################################
# Web-proxy backend selection
#
# For /lab/<lab_session_id>/web/<port>/..., we want to route to the same backend
# as /api/start_lab/<lab_id> (lab_id parity), not lab_session_id parity.
# The backend returns URLs with ?lab_id=<lab_id> for this reason.
############################################

map $arg_lab_id $web_route_id {
    ~^[0-9]+$ $arg_lab_id;
    default   $lab_id;
}

map $web_route_id $web_lab_backend {
    ~^[0-9]*[02468]$ backend_a;
    ~^[0-9]*[13579]$ backend_b;
    default backend_a;
}

map $effective_flow_type $web_flow_backend {
    LABTAINER $web_lab_backend;
    CUSTOM backend_c;
    default backend_c;
}

map $web_flow_backend $web_flow_host {
    backend_a 192.168.187.99;
    backend_b 192.168.187.98;
    backend_c 127.0.0.1;
    default   127.0.0.1;
}


############################################
# Backend selection by ID parity
############################################

map $lab_id $lab_backend {
    ~^[0-9]*[02468]$ backend_a;
    ~^[0-9]*[13579]$ backend_b;
    default backend_c;
}


############################################
# Backend selection by flow type (HTTP /lab*)
############################################

map $effective_flow_type $flow_backend {
    LABTAINER $lab_backend;
    CUSTOM backend_c;
    default backend_c;
}


############################################
# WebSocket (/socket.io) routing
#
# Requirement: once a socket is established to A/B, all follow-up
# Socket.IO requests for that session must go to the same backend.
#
# We route Socket.IO by lab_id from query string (?lab_id=<int>)
############################################

map $arg_lab_id $ws_routing_id {
    ~^([0-9]+)$ $1;
    default     "";
}

map $ws_routing_id $ws_lab_backend {
    ~^[0-9]*[02468]$ backend_a;
    ~^[0-9]*[13579]$ backend_b;
    default backend_c;
}

map $effective_flow_type $ws_backend {
    LABTAINER $ws_lab_backend;
    CUSTOM backend_c;
    default backend_c;
}


############################################
# SERVER
############################################

server {
    listen 80;
    server_name labtainer.local.com;

    # Support both /admin and /admin/ without relying on upstream strict slashes.
    location = /admin {
        proxy_pass http://backend_c;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    ############################################
    # Socket.IO (WebSocket + polling)
    ############################################
    location ^~ /socket.io/ {
        proxy_pass http://$ws_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # WebSocket sessions can stay open for a long time.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    ############################################
    # Admin (always backend_c)
    ############################################
    location ^~ /admin/ {
        proxy_pass http://backend_c;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    ############################################
    # START LAB
    ############################################
    location ~ ^/api/start_lab/[0-9]+ {
        proxy_pass http://$flow_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Lab start may take a long time (docker build/run).
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }

    ############################################
    # LAB API
    ############################################
    location ~ ^/api/lab/[0-9]+ {
        proxy_pass http://$flow_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # /api/lab/<id>/run-commands can take a long time.
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }

    ############################################
    # LAB TERMINAL
    ############################################
    location ~ ^/lab/[0-9]+/terminal {
        proxy_pass http://$flow_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    ############################################
    # LAB WEB PROXY
    #
    # Access web services started on the routed backend via:
    #   /lab/<id>/web/<port>/...
    #
    # This keeps the public entrypoint on port 80 while proxying to
    # the backend's local service port.
    ############################################

    # Route-by-prefix web proxy (preferred): code returns vul-lab-a/b/c so nginx does
    # not need flow_type to decide backend.

    location ~ ^/vul-lab-a/([0-9]+)/web/([0-9]+)$ {
        return 302 $uri/$is_args$args;
    }

    location ~ ^/vul-lab-a/([0-9]+)/web/([0-9]+)/(.*)$ {
        set $web_port $2;
        set $web_path $3;
        set $web_target_host $backend_a_ip;

        if ($web_port !~ "^(8[0-9][0-9][0-9]|9[0-9][0-9][0-9]|10000|5[0-9][0-9][0-9][0-9]|60000)$") { return 400; }

        add_header X-Debug-Web-Flow-Host $web_target_host always;
        add_header X-Debug-Web-Port $web_port always;
        add_header X-Debug-Web-Vul-Path $web_path always;

        proxy_pass http://$web_target_host:$web_port/$web_path$is_args$args;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ~ ^/vul-lab-b/([0-9]+)/web/([0-9]+)$ {
        return 302 $uri/$is_args$args;
    }

    location ~ ^/vul-lab-b/([0-9]+)/web/([0-9]+)/(.*)$ {
        set $web_port $2;
        set $web_path $3;
        set $web_target_host $backend_b_ip;

        if ($web_port !~ "^(8[0-9][0-9][0-9]|9[0-9][0-9][0-9]|10000|5[0-9][0-9][0-9][0-9]|60000)$") { return 400; }

        add_header X-Debug-Web-Flow-Host $web_target_host always;
        add_header X-Debug-Web-Port $web_port always;
        add_header X-Debug-Web-Vul-Path $web_path always;

        proxy_pass http://$web_target_host:$web_port/$web_path$is_args$args;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ~ ^/vul-lab-c/([0-9]+)/web/([0-9]+)$ {
        return 302 $uri/$is_args$args;
    }

    location ~ ^/vul-lab-c/([0-9]+)/web/([0-9]+)/(.*)$ {
        set $web_port $2;
        set $web_path $3;
        set $web_target_host $backend_c_ip;

        if ($web_port !~ "^(8[0-9][0-9][0-9]|9[0-9][0-9][0-9]|10000|5[0-9][0-9][0-9][0-9]|60000)$") { return 400; }

        add_header X-Debug-Web-Flow-Host $web_target_host always;
        add_header X-Debug-Web-Port $web_port always;
        add_header X-Debug-Web-Vul-Path $web_path always;

        proxy_pass http://$web_target_host:$web_port/$web_path$is_args$args;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    ############################################
    # DEFAULT ROUTE (backend_c)
    ############################################
    location / {
        proxy_pass http://backend_c;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

